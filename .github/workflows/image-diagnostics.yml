name: Image Access Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-images:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Ensure Git LFS files are retrieved
        run: |
          git lfs version
          git lfs pull

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: Decode and inspect source images
        run: |
          python << 'PY'
          import hashlib
          import json
          from pathlib import Path
          from PIL import Image

          paths = [
              Path("images/P083_main.png"),
              Path("images/P084_main.png"),
              Path("images/P090_main.png"),
          ]

          report = []
          failed = False

          for path in paths:
              item = {
                  "path": str(path),
                  "exists": path.exists(),
                  "byte_count": None,
                  "sha256": None,
                  "format": None,
                  "width": None,
                  "height": None,
                  "mode": None,
                  "decoded": False,
                  "error": None,
              }

              try:
                  if not path.exists():
                      raise FileNotFoundError("File is missing")

                  data = path.read_bytes()

                  if not data:
                      raise ValueError("File is empty")

                  if data.startswith(b"version https://git-lfs"):
                      raise ValueError("Unresolved Git LFS pointer")

                  item["byte_count"] = len(data)
                  item["sha256"] = hashlib.sha256(data).hexdigest()

                  with Image.open(path) as image:
                      image.load()
                      item["format"] = image.format
                      item["width"] = image.width
                      item["height"] = image.height
                      item["mode"] = image.mode
                      item["decoded"] = True

              except Exception as exc:
                  item["error"] = f"{type(exc).__name__}: {exc}"
                  failed = True

              report.append(item)

          output = {
              "workflow": "image-access-diagnostics",
              "purpose": "Verify repository image bytes can be retrieved and decoded; this does not perform visual inspection.",
              "images": report,
              "status": "failed" if failed else "passed",
          }

          Path("image-diagnostics").mkdir(exist_ok=True)

          with open("image-diagnostics/report.json", "w", encoding="utf-8") as handle:
              json.dump(output, handle, indent=2)

          with open("image-diagnostics/report.txt", "w", encoding="utf-8") as handle:
              for item in report:
                  handle.write(f"{item['path']}\n")
                  handle.write(f"  exists: {item['exists']}\n")
                  handle.write(f"  byte_count: {item['byte_count']}\n")
                  handle.write(f"  sha256: {item['sha256']}\n")
                  handle.write(f"  format: {item['format']}\n")
                  handle.write(f"  dimensions: {item['width']}x{item['height']}\n")
                  handle.write(f"  mode: {item['mode']}\n")
                  handle.write(f"  decoded: {item['decoded']}\n")
                  handle.write(f"  error: {item['error']}\n\n")

          print(json.dumps(output, indent=2))

          if failed:
              raise SystemExit(1)
          PY

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-diagnostics
          path: |
            image-diagnostics/report.json
            image-diagnostics/report.txt
          if-no-files-found: error
